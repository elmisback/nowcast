<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nowcast — Weather Widget</title>
<style>
  :root{
    --bg:#0F1620;
    --panel:#16202C;
    --panel-edge:#202D3B;
    --grid:#22303F;
    --text:#E8EDF2;
    --muted:#7C8B9C;
    --dim:#4C5E70;
    --temp:#F2A65A;
    --temp-glow:rgba(242,166,90,0.18);
    --precip:#4FA8D8;
    --humidity:#9FBFD0;
    --sun:#E8B84B;
    --now-line:#E8EDF2;
    --good:#6FCF97;
    --warn:#E8A33D;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    width:100%;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #16202c 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:0;
  }
  .widget{
    width:100%;
    background:linear-gradient(180deg, var(--panel) 0%, #131C26 100%);
    border-bottom:1px solid var(--panel-edge);
    overflow:hidden;
  }

  /* Header */
  .head{
    padding:14px 16px 12px;
    border-bottom:1px solid var(--panel-edge);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .loc{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .loc-name{color:var(--text); font-weight:700; letter-spacing:0;}
  .now-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-top:5px;
  }
  .temp-big{
    font-size:36px;
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .cond{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
  }
  .cond-emoji.moon{
    filter:grayscale(40%) saturate(70%) brightness(1.3) hue-rotate(190deg);
    display:inline-block;
  }
  .updated{
    text-align:right;
    font-size:10px;
    color:var(--dim);
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
    white-space:nowrap;
    margin-top:2px;
  }
  .status-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--good);
    margin-right:5px;
    box-shadow:0 0 6px var(--good);
    animation:pulse 2.4s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  /* Graph */
  .graph-wrap{
    padding:12px 16px 4px;
  }
  .graph-toprow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:6px;
  }
  .graph-label{
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--dim);
    font-weight:700;
  }
  .range-group{
    display:inline-flex;
    background:#0F1720;
    border:1px solid var(--panel-edge);
    border-radius:9px;
    padding:2px;
    gap:2px;
  }
  .range-btn{
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.02em;
    padding:5px 10px;
    border-radius:7px;
    cursor:pointer;
  }
  .range-btn:hover{color:var(--text);}
  .range-btn.active{
    background:var(--panel-edge);
    color:var(--text);
  }
  .legend{
    display:flex;
    gap:12px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10px;
    color:var(--muted);
    font-weight:600;
  }
  .legend-swatch{
    width:9px; height:9px; border-radius:2px; flex:none;
  }
  #graphSvgContainer{
    width:100%;
    height:190px;
  }
  #graphSvgContainer svg{display:block; width:100%; height:100%;}
  .axis-text{
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
    font-size:11px;
    fill:var(--dim);
  }
  .axis-text.day{ fill:var(--muted); font-weight:700; }
  .axis-text.humidity{ fill:var(--humidity); opacity:0.8; }
  .temp-line{
    fill:none;
    stroke:var(--temp);
    stroke-width:2.25;
    stroke-linejoin:round;
    stroke-linecap:round;
  }
  .temp-area{fill:url(#tempGrad);}
  .humidity-line{
    fill:none;
    stroke:var(--humidity);
    stroke-width:1.25;
    stroke-dasharray:4,3;
    stroke-linejoin:round;
    stroke-linecap:round;
    opacity:0.58;
  }
  .precip-bar{fill:var(--precip);}
  .now-marker{stroke:var(--now-line); stroke-width:1; stroke-dasharray:2,3; opacity:0.55;}
  .now-label{
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
    font-size:10px;
    fill:var(--text);
    font-weight:600;
  }
  .daybound-line{ stroke:var(--panel-edge); stroke-width:1; }
  .cond-marker{stroke:var(--dim); stroke-width:1; stroke-dasharray:1.5,2; opacity:0.5;}
  .cond-icon{font-size:14px;}
  .cond-icon.moon{
    filter:grayscale(40%) saturate(70%) brightness(1.3) hue-rotate(190deg);
  }
  .night-band{ fill:#0B111A; opacity:0.55; }
  .sun-label{ font-family:ui-monospace,"SF Mono","Cascadia Code",monospace; font-size:9px; fill:var(--muted); font-weight:600; }

  /* Notes ticker */
  .notes{
    padding:12px 16px 16px;
    border-top:1px solid var(--panel-edge);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .note{
    display:flex;
    align-items:flex-start;
    gap:9px;
    font-size:12.5px;
    line-height:1.4;
    color:var(--text);
  }
  .note .tag{
    flex:none;
    width:15px;
    text-align:center;
    font-size:13px;
    margin-top:1px;
  }
  .note .txt b{color:var(--precip); font-weight:700;}
  .note .txt .warn{color:var(--warn); font-weight:700;}
  .empty-note{color:var(--muted); font-size:12px;}

  .foot{
    padding:8px 16px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .refresh-btn{
    background:var(--panel-edge);
    color:var(--muted);
    border:none;
    border-radius:8px;
    padding:6px 10px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .refresh-btn:hover{color:var(--text); background:#28374a;}
  .source{
    font-size:9.5px;
    color:var(--dim);
    font-family:ui-monospace,"SF Mono","Cascadia Code",monospace;
  }

  .loading, .error{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }
  .error{color:var(--warn);}
  .error button{
    margin-top:10px;
    background:var(--precip);
    color:#0F1620;
    border:none;
    border-radius:8px;
    padding:7px 14px;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="loading" id="loading">Locating & fetching forecast…</div>
</div>

<script>
const FALLBACK_COORDS = { latitude: 40.6142, longitude: -79.9581 }; // used only if geolocation is denied
const REFRESH_MS = 5 * 60 * 1000;   // full data refetch
const TICK_MS = 60 * 1000;          // lightweight re-render (keeps "now" line accurate)
const NEAR_TERM_MIN = 240;          // notes only look this far ahead (4 hrs)
let refreshTimer = null, tickTimer = null, resizeTimer = null;
let weatherData = null;
let currentRangeHours = 5;

const RANGES = [
  { key:"5h",  label:"5H",  hours:5 },
  { key:"24h", label:"24H", hours:24 },
  { key:"3d",  label:"3D",  hours:72 },
  { key:"7d",  label:"7D",  hours:168 }
];

// [dayIcon, nightIcon, label]
const WMO = {
  0:["☀️","🌙","Clear sky"],1:["🌤️","🌙","Mostly clear"],2:["⛅","☁️","Partly cloudy"],3:["☁️","☁️","Overcast"],
  45:["🌫️","🌫️","Fog"],48:["🌫️","🌫️","Freezing fog"],
  51:["🌦️","🌧️","Light drizzle"],53:["🌦️","🌧️","Drizzle"],55:["🌦️","🌧️","Dense drizzle"],
  56:["🌧️","🌧️","Freezing drizzle"],57:["🌧️","🌧️","Freezing drizzle"],
  61:["🌧️","🌧️","Light rain"],63:["🌧️","🌧️","Rain"],65:["🌧️","🌧️","Heavy rain"],
  66:["🌧️","🌧️","Freezing rain"],67:["🌧️","🌧️","Freezing rain"],
  71:["🌨️","🌨️","Light snow"],73:["🌨️","🌨️","Snow"],75:["❄️","❄️","Heavy snow"],77:["🌨️","🌨️","Snow grains"],
  80:["🌦️","🌧️","Light showers"],81:["🌦️","🌧️","Showers"],82:["⛈️","⛈️","Heavy showers"],
  85:["🌨️","🌨️","Snow showers"],86:["🌨️","🌨️","Snow showers"],
  95:["⛈️","⛈️","Thunderstorm"],96:["⛈️","⛈️","Thunderstorm w/ hail"],99:["⛈️","⛈️","Thunderstorm w/ hail"]
};

function condFor(code, isDay){
  const rec = WMO[code] || ["🌡️","🌡️","—"];
  return { icon: isDay ? rec[0] : rec[1], text: rec[2], isMoon: !isDay };
}
function fmtTime(d){ return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function fmtTimeLabel(d){ let h=d.getHours()%12; if(h===0) h=12; return `${h}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fmtTimeCompact(d){
  let h = d.getHours(); const m = d.getMinutes();
  const ap = h>=12 ? 'p':'a';
  h = h % 12; if(h===0) h=12;
  return m===0 ? `${h}${ap}` : `${h}:${String(m).padStart(2,'0')}${ap}`;
}
function fmtDayShort(d){ return d.toLocaleDateString([], {weekday:'short'}); }
function round(n){ return Math.round(n); }

async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    if(!r.ok) throw new Error("geocode failed");
    const d = await r.json();
    return d.city || d.locality || d.principalSubdivision || "Your location";
  }catch(e){
    return "Your location";
  }
}

function getPosition(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(FALLBACK_COORDS); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({latitude:pos.coords.latitude, longitude:pos.coords.longitude}),
      ()  => resolve(FALLBACK_COORDS),
      { timeout: 6000 }
    );
  });
}

async function fetchWeather(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,precipitation,cloud_cover,weather_code,is_day,relative_humidity_2m`
    + `&minutely_15=temperature_2m,precipitation,weather_code,is_day,relative_humidity_2m`
    + `&hourly=temperature_2m,precipitation,weather_code,cloud_cover,is_day,relative_humidity_2m`
    + `&daily=sunrise,sunset`
    + `&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto&forecast_days=8`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Forecast request failed");
  return r.json();
}

function buildNotes(data){
  const notes = [];
  const now = new Date();
  const allTimes = data.minutely_15.time.map(t => new Date(t));
  const allPrecip = data.minutely_15.precipitation;

  let nowIdx = allTimes.findIndex(t => t >= now);
  if(nowIdx === -1) nowIdx = 0;

  // Only ever look a few hours ahead for these — a precip change two or
  // three days out isn't a "heads up" note, it's just the forecast.
  const nearCount = Math.min(allTimes.length - nowIdx, Math.round(NEAR_TERM_MIN/15) + 1);
  const times = allTimes.slice(nowIdx, nowIdx + nearCount);
  const precip = allPrecip.slice(nowIdx, nowIdx + nearCount);

  let currentlyWet = precip[0] > 0.001;
  let changeIdx = -1;
  for(let i=1;i<precip.length;i++){
    const wet = precip[i] > 0.001;
    if(wet !== currentlyWet){ changeIdx = i; break; }
  }
  if(changeIdx > -1){
    const mins = Math.round((times[changeIdx] - now)/60000);
    if(!currentlyWet){
      notes.push({tag:"🌧️", html:`Rain likely starting in <b>~${mins} min</b> (${fmtTime(times[changeIdx])})`});
    } else {
      notes.push({tag:"🌤️", html:`Rain expected to ease in <b>~${mins} min</b> (${fmtTime(times[changeIdx])})`});
    }
  } else if(currentlyWet){
    notes.push({tag:"🌧️", html:`Precipitation continuing through the next few hours`});
  }

  const hTimes = data.hourly.time.map(t=>new Date(t));
  const hClouds = data.hourly.cloud_cover;
  let hStart = hTimes.findIndex(t => t >= now);
  if(hStart === -1) hStart = 0;
  const c0 = hClouds[hStart];
  const c6 = hClouds[Math.min(hStart+6, hClouds.length-1)];
  const delta = c6 - c0;
  if(Math.abs(delta) >= 20){
    notes.push({
      tag: delta > 0 ? "☁️" : "🌤️",
      html: delta > 0
        ? `Clouds building over the next few hours (${round(c0)}% → ${round(c6)}%)`
        : `Skies clearing up over the next few hours (${round(c0)}% → ${round(c6)}%)`
    });
  } else {
    notes.push({tag:"⛅", html:`Cloud cover holding steady around <b>${round(c0)}%</b>`});
  }

  const maxP = Math.max(...precip);
  if(maxP > 0.02){
    const idx = precip.indexOf(maxP);
    notes.push({tag:"💧", html:`Heaviest rain around <span class="warn">${fmtTime(times[idx])}</span> (${maxP.toFixed(2)}" /15min)`});
  }

  return notes;
}

function getSeriesForRange(data, hours){
  const now = new Date();
  const useMinutely = hours <= 6;

  if(useMinutely){
    const times = data.minutely_15.time.map(t => new Date(t));
    let startIdx = times.findIndex(t => t >= now);
    if(startIdx === -1) startIdx = 0;
    startIdx = Math.max(0, startIdx - 1);
    const pointsWanted = Math.round((hours*60)/15) + 2;
    const endIdx = Math.min(times.length, startIdx + pointsWanted);
    return {
      times: times.slice(startIdx, endIdx),
      temps: data.minutely_15.temperature_2m.slice(startIdx, endIdx),
      precip: data.minutely_15.precipitation.slice(startIdx, endIdx),
      codes: data.minutely_15.weather_code.slice(startIdx, endIdx),
      isDay: data.minutely_15.is_day.slice(startIdx, endIdx),
      humidity: data.minutely_15.relative_humidity_2m.slice(startIdx, endIdx)
    };
  }

  const times = data.hourly.time.map(t => new Date(t));
  let startIdx = times.findIndex(t => t >= now);
  if(startIdx === -1) startIdx = 0;
  const pointsWanted = hours + 1;
  const endIdx = Math.min(times.length, startIdx + pointsWanted);
  return {
    times: times.slice(startIdx, endIdx),
    temps: data.hourly.temperature_2m.slice(startIdx, endIdx),
    precip: data.hourly.precipitation.slice(startIdx, endIdx),
    codes: data.hourly.weather_code.slice(startIdx, endIdx),
    isDay: data.hourly.is_day.slice(startIdx, endIdx),
    humidity: data.hourly.relative_humidity_2m.slice(startIdx, endIdx)
  };
}

function renderGraph(hours, pixelW, pixelH){
  const data = weatherData;
  const now = new Date();
  const series = getSeriesForRange(data, hours);
  const { times: wTimes, temps: wTemps, precip: wPrecip, codes: wCodes, isDay: wIsDay, humidity: wHum } = series;

  if(wTimes.length < 2) return `<div class="empty-note">Not enough data for this range.</div>`;

  const showSun = hours <= 24;

  const W = Math.max(240, Math.round(pixelW));
  const H = Math.max(120, Math.round(pixelH));
  const padL = 34, padR = 32;
  const padT = 32;
  const padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const tMin = Math.min(...wTemps) - 2;
  const tMax = Math.max(...wTemps) + 2;
  const pMax = Math.max(0.05, ...wPrecip);

  const n = wTimes.length;
  const x = i => padL + (i/(n-1)) * plotW;
  const yTemp = v => padT + plotH - ((v - tMin)/(tMax - tMin)) * plotH;
  const yHum = v => padT + plotH - (Math.max(0,Math.min(100,v))/100) * plotH;
  const yPrecipTop = v => padT + plotH - (v/pMax) * (plotH*0.5);

  let linePath = "";
  wTemps.forEach((v,i)=>{
    linePath += (i===0?"M":"L") + x(i).toFixed(1) + "," + yTemp(v).toFixed(1) + " ";
  });
  let areaPath = linePath + `L${x(n-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${x(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  let humPath = "";
  wHum.forEach((v,i)=>{
    humPath += (i===0?"M":"L") + x(i).toFixed(1) + "," + yHum(v).toFixed(1) + " ";
  });

  const barW = Math.max(1.2, (plotW / n) * 0.55);
  let bars = "";
  wPrecip.forEach((v,i)=>{
    if(v <= 0.001) return;
    const yTop = yPrecipTop(v);
    const h = (padT+plotH) - yTop;
    bars += `<rect class="precip-bar" x="${(x(i)-barW/2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.2" opacity="0.85"/>`;
  });

  let nowIdx = 0, best = Infinity;
  wTimes.forEach((t,i)=>{ const d=Math.abs(t-now); if(d<best){best=d; nowIdx=i;} });
  const nowX = x(nowIdx);

  // --- x-axis ticks: standardized clock times, day names at midnight ---
  let tickHours;
  if(hours <= 5) tickHours = 1;
  else if(hours <= 24) tickHours = 3;
  else if(hours <= 72) tickHours = 6;
  else tickHours = 12;

  const rawTicks = [{ i:0, text: fmtTimeCompact(wTimes[0]), isDay:false, anchor:true }];
  for(let i=1;i<n;i++){
    const t = wTimes[i];
    if(t.getMinutes() !== 0) continue;
    if(t.getHours() % tickHours !== 0) continue;
    const midnight = t.getHours() === 0;
    rawTicks.push({ i, text: midnight ? fmtDayShort(t) : fmtTimeCompact(t), isDay: midnight, anchor:false });
  }

  const minGapPx = 34;
  const keptTicks = [];
  let lastX = -Infinity;
  rawTicks.forEach(tk=>{
    const px = x(tk.i);
    if(tk.anchor || tk.isDay || (px - lastX) >= minGapPx){
      keptTicks.push(tk);
      lastX = px;
    }
  });

  let xLabels = "";
  let dayBoundLines = "";
  keptTicks.forEach(tk=>{
    const px = x(tk.i);
    xLabels += `<text class="axis-text${tk.isDay?' day':''}" x="${px.toFixed(1)}" y="${H-6}" text-anchor="middle">${tk.text}</text>`;
    if(tk.isDay){
      dayBoundLines += `<line class="daybound-line" x1="${px.toFixed(1)}" y1="${padT}" x2="${px.toFixed(1)}" y2="${padT+plotH}"/>`;
    }
  });

  const yLabels = `
    <text class="axis-text" x="${padL-6}" y="${(yTemp(tMax-2)).toFixed(1)}" text-anchor="end">${round(tMax-2)}°</text>
    <text class="axis-text" x="${padL-6}" y="${(yTemp(tMin+2)).toFixed(1)}" text-anchor="end">${round(tMin+2)}°</text>
    <text class="axis-text humidity" x="${W-padR+6}" y="${(padT+6).toFixed(1)}" text-anchor="start">100%</text>
    <text class="axis-text humidity" x="${W-padR+6}" y="${(padT+plotH).toFixed(1)}" text-anchor="start">0%</text>
  `;

  const gridY1 = padT + plotH*0.33, gridY2 = padT + plotH*0.66;

  // --- day/night shading + exact sunrise/sunset labels ---
  let sunMarkup = "";
  if(showSun && data.daily && data.daily.sunrise){
    const winStart = wTimes[0], winEnd = wTimes[n-1];
    const events = [];
    data.daily.sunrise.forEach(t=>{ const d=new Date(t); if(d>=winStart && d<=winEnd) events.push({type:'sunrise', time:d}); });
    data.daily.sunset.forEach(t=>{ const d=new Date(t); if(d>=winStart && d<=winEnd) events.push({type:'sunset', time:d}); });
    events.sort((a,b)=>a.time-b.time);
    let cursor = winStart;
    let day = wIsDay[0] === 1;
    events.forEach(ev=>{
      const a = Math.max(cursor, winStart), b = Math.min(ev.time, winEnd);
      if(!day && b>a){
        const x1 = padL + ((a-winStart)/(winEnd-winStart))*plotW;
        const x2 = padL + ((b-winStart)/(winEnd-winStart))*plotW;
        sunMarkup += `<rect class="night-band" x="${x1.toFixed(1)}" y="${padT}" width="${Math.max(0,x2-x1).toFixed(1)}" height="${plotH}"/>`;
      }
      const px = padL + ((ev.time-winStart)/(winEnd-winStart))*plotW;
      sunMarkup += `<text class="sun-label" x="${px.toFixed(1)}" y="${padT+13}" text-anchor="middle">${fmtTimeLabel(ev.time)}</text>`;
      cursor = ev.time;
      day = ev.type === 'sunrise';
    });
    if(!day && cursor < winEnd){
      const x1 = padL + ((cursor-winStart)/(winEnd-winStart))*plotW;
      sunMarkup += `<rect class="night-band" x="${x1.toFixed(1)}" y="${padT}" width="${Math.max(0,W-padR-x1).toFixed(1)}" height="${plotH}"/>`;
    }
  }

  // --- weather-condition icons: fixed row, new icon whenever it changes ---
  const condRowY = 15;
  const iconMinGapPx = 46;
  let condMarkup = "";
  let lastCode = null, lastIconX = -Infinity;
  wCodes.forEach((code, i) => {
    const changed = lastCode === null || code !== lastCode;
    const px = x(i);
    if(changed && (px - lastIconX) >= iconMinGapPx){
      const { icon, isMoon } = condFor(code, wIsDay[i]);
      const ly = yTemp(wTemps[i]);
      condMarkup += `
        <line class="cond-marker" x1="${px.toFixed(1)}" y1="${condRowY+7}" x2="${px.toFixed(1)}" y2="${ly.toFixed(1)}"/>
        <text class="cond-icon${isMoon?' moon':''}" x="${px.toFixed(1)}" y="${condRowY+5}" text-anchor="middle">${icon}</text>
      `;
      lastIconX = px;
    }
    lastCode = code;
  });

  return `
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs>
      <linearGradient id="tempGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--temp-glow)"/>
        <stop offset="100%" stop-color="rgba(242,166,90,0)"/>
      </linearGradient>
    </defs>
    <line x1="${padL}" y1="${gridY1.toFixed(1)}" x2="${W-padR}" y2="${gridY1.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
    <line x1="${padL}" y1="${gridY2.toFixed(1)}" x2="${W-padR}" y2="${gridY2.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
    ${dayBoundLines}
    ${sunMarkup}
    ${bars}
    <path d="${areaPath}" class="temp-area"/>
    <path d="${humPath}" class="humidity-line"/>
    <path d="${linePath}" class="temp-line"/>
    <line x1="${nowX.toFixed(1)}" y1="${padT}" x2="${nowX.toFixed(1)}" y2="${padT+plotH}" class="now-marker"/>
    <text class="now-label" x="${Math.min(nowX+4, W-24)}" y="${H-6}">now</text>
    ${condMarkup}
    ${yLabels}
    ${xLabels}
  </svg>`;
}

function renderRangeButtons(){
  return `<div class="range-group" id="rangeGroup">
    ${RANGES.map(r => `<button class="range-btn${r.hours===currentRangeHours?' active':''}" data-hours="${r.hours}">${r.label}</button>`).join("")}
  </div>`;
}

function refreshGraphOnly(){
  const container = document.getElementById('graphSvgContainer');
  if(!container || !weatherData) return;
  const rect = container.getBoundingClientRect();
  if(rect.width < 10) return;
  container.innerHTML = renderGraph(currentRangeHours, rect.width, rect.height);
  document.querySelectorAll('.range-btn').forEach(btn=>{
    btn.classList.toggle('active', Number(btn.dataset.hours) === currentRangeHours);
  });
}

function wireRangeButtons(){
  document.querySelectorAll('.range-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentRangeHours = Number(btn.dataset.hours);
      refreshGraphOnly();
    });
  });
}

function wireResize(){
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refreshGraphOnly, 150);
  });
}

async function loadAndRender(){
  const widget = document.getElementById('widget');
  try{
    const {latitude, longitude} = await getPosition();
    const [data, place] = await Promise.all([
      fetchWeather(latitude, longitude),
      reverseGeocode(latitude, longitude)
    ]);
    weatherData = data;

    const cur = data.current;
    const { icon: condIcon, text: condText, isMoon } = condFor(cur.weather_code, cur.is_day);
    const notes = buildNotes(data);

    widget.innerHTML = `
      <div class="head">
        <div>
          <div class="loc">Now · <span class="loc-name">${place}</span></div>
          <div class="now-row">
            <div class="temp-big">${round(cur.temperature_2m)}°</div>
            <div class="cond"><span class="cond-emoji${isMoon?' moon':''}">${condIcon}</span> ${condText} · 💧${round(cur.relative_humidity_2m)}%</div>
          </div>
        </div>
        <div class="updated"><span class="status-dot"></span>${fmtTime(new Date())}</div>
      </div>
      <div class="graph-wrap">
        <div class="graph-toprow">
          <div class="graph-label">Temp, humidity &amp; precipitation</div>
          ${renderRangeButtons()}
        </div>
        <div class="legend">
          <div class="legend-item"><span class="legend-swatch" style="background:var(--temp)"></span>Temp</div>
          <div class="legend-item"><span class="legend-swatch" style="background:var(--humidity)"></span>Humidity</div>
          <div class="legend-item"><span class="legend-swatch" style="background:var(--precip)"></span>Precip</div>
        </div>
        <div id="graphSvgContainer"></div>
      </div>
      <div class="notes">
        ${notes.length ? notes.map(n=>`<div class="note"><span class="tag">${n.tag}</span><span class="txt">${n.html}</span></div>`).join("") : `<div class="empty-note">No notable changes in the next few hours.</div>`}
      </div>
      <div class="foot">
        <button class="refresh-btn" id="refreshBtn">Refresh now</button>
        <span class="source">open-meteo.com · data every 5min</span>
      </div>
    `;
    document.getElementById('refreshBtn').addEventListener('click', loadAndRender);
    wireRangeButtons();
    refreshGraphOnly();
  }catch(err){
    widget.innerHTML = `
      <div class="error">
        Couldn't load the forecast.<br>${err.message || ''}
        <br><button id="retryBtn">Try again</button>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', loadAndRender);
  }

  if(refreshTimer) clearInterval(refreshTimer);
  if(tickTimer) clearInterval(tickTimer);
  refreshTimer = setInterval(loadAndRender, REFRESH_MS);
  tickTimer = setInterval(refreshGraphOnly, TICK_MS);
}

wireResize();
loadAndRender();
</script>

</body>
</html>
